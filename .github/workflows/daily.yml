name: Daily language plan

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 06:00 KST (GitHub may delay scheduled runs by several minutes)
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write           # commit docs/feed.xml and state.json

concurrency:
  group: daily-plan
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check secrets are set (values are never printed)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          bad=0
          if [ -n "$GMAIL_USER" ]; then echo "GMAIL_USER: set (${#GMAIL_USER} chars)"; else echo "GMAIL_USER: MISSING"; bad=1; fi
          if [ -n "$GMAIL_APP_PASSWORD" ]; then echo "GMAIL_APP_PASSWORD: set (${#GMAIL_APP_PASSWORD} chars)"; else echo "GMAIL_APP_PASSWORD: MISSING"; bad=1; fi
          exit $bad
      - name: Build queue, update feed, send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python build_daily.py --send
      - name: Commit feed and state
        if: always()   # keep the feed/state even if the email step failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml state.json
          git diff --cached --quiet || (git commit -m "Daily update" && git push)
