name: Daily language plan

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 06:00 KST (GitHub may delay scheduled runs by several minutes)
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write           # commit docs/feed.xml and state.json

concurrency:
  group: daily-plan
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build queue, update feed, send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python build_daily.py --send
      - name: Commit feed and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml state.json
          git diff --cached --quiet || (git commit -m "Daily update" && git push)
