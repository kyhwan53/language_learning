<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복습 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+JP:wght@500&display=swap">
<style>
/* Generated by build_daily.py from content/*.toml - edit templates/study.html, not docs/study.html. */
:root {
  --bg: #f4f6f8; --card: #ffffff; --ink: #14202a; --muted: #607080; --line: #e1e6eb;
  --en: #2f6fed; --en-soft: #e8efff; --jp: #c2410c; --jp-soft: #fdeee6;
  --f: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f161c; --card: #17212a; --ink: #e4ebf0; --muted: #94a4b0; --line: #283642;
  --en: #7ea6ff; --en-soft: #1b2a4a; --jp: #f59a6b; --jp-soft: #3a2418; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 560px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left)) 48px max(16px, env(safe-area-inset-right)); display: grid; gap: 14px; }
h1 { font-size: 20px; margin: 0; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--line); padding: 4px; border-radius: 10px; }
.tabs button { border: 0; border-radius: 7px; padding: 9px; font: inherit; font-weight: 600; background: transparent; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); }
.nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.nav button { height: 44px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; font-size: 18px; cursor: pointer; }
.nav button:disabled { opacity: .35; cursor: default; }
.when { text-align: center; }
.when b { display: block; font-size: 17px; }
.when span { font-size: 13px; color: var(--muted); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; flex-wrap: wrap; }
.bar label { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
.linkbtn { border: 0; background: none; color: var(--en); font: inherit; font-size: 14px; cursor: pointer; padding: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 10px; }
.en { font-size: 22px; font-weight: 700; line-height: 1.35; }
.ko { font-size: 15px; }
.ex { font-style: italic; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }
.hid { filter: blur(6px); cursor: pointer; user-select: none; }
.card a { font-size: 14px; text-decoration: none; }
.kana { display: flex; gap: 22px; }
.kana div { text-align: center; }
.kana .k { font-family: var(--f-jp); font-size: 44px; line-height: 1.15; }
.kana .r { font-size: 14px; color: var(--muted); }
.jp { font-family: var(--f-jp); font-size: 20px; }
.sub { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
h2 { font-size: 15px; margin: 10px 0 0; color: var(--muted); font-weight: 600; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.list button { display: grid; grid-template-columns: 52px 1fr; gap: 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font: inherit; padding: 10px 14px; cursor: pointer; }
.list button:last-child { border-bottom: 0; }
.list button[aria-current="true"] { background: var(--en-soft); }
.list .d { font-size: 13px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.list .t { font-weight: 600; }
.list .m { font-size: 13px; color: var(--muted); }
.chart { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.chart button { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 8px; padding: 6px 0; font: inherit; cursor: pointer; opacity: .45; }
.chart button.on { opacity: 1; color: var(--ink); }
.chart button.now { border-color: var(--jp); background: var(--jp-soft); }
.chart .k { font-family: var(--f-jp); font-size: 20px; display: block; line-height: 1.2; }
.chart .r { font-size: 11px; }
.chart button:disabled { cursor: default; }
[hidden] { display: none !important; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--en); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>복습 노트</h1>
  <div class="tabs" role="tablist">
    <button id="tab-en" role="tab" aria-selected="true">업무 영어</button>
    <button id="tab-jp" role="tab" aria-selected="false">일본어</button>
  </div>
  <div class="nav">
    <button id="prev" aria-label="이전 날">◀</button>
    <div class="when"><b id="date"></b><span id="nth"></span></div>
    <button id="next" aria-label="다음 날">▶</button>
  </div>
  <div class="bar">
    <label><input type="checkbox" id="hide"> 뜻 가리고 맞히기</label>
    <button class="linkbtn" id="today">오늘로 →</button>
  </div>
  <div class="card" id="card"></div>
  <div id="more"></div>
</div>
<script>
const DATA = /*DATA*/null;
const DAY = 86400000;
const iso = t => new Date(t).toISOString().slice(0, 10);
const start = Date.parse(DATA.start + "T00:00:00Z");
const today = Math.max(Math.floor((Date.now() + 9 * 3600000 - start) / DAY), 0);  // KST day index
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
let tab = "en", n = today, hide = false;

const phrase = i => DATA.phrases[i % DATA.phrases.length];
const kanaAt = i => Array.from({length: DATA.kanaPerDay}, (_, j) => DATA.kana[(i * DATA.kanaPerDay + j) % DATA.kana.length]);
const jpPhrase = i => DATA.jpPhrases[i % DATA.jpPhrases.length];
const label = i => { const d = new Date(start + i * DAY); return `${d.getUTCMonth() + 1}/${d.getUTCDate()} (${WEEK[d.getUTCDay()]})`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const youglish = en => "https://youglish.com/pronounce/" + encodeURIComponent(en.replace(/\(.*?\)|\.\.\.|…|[?.!]$/g, "").trim().replace(/^to /, "").replace(/^[ ,]+|[ ,]+$/g, "")) + "/english";
const translate = jp => "https://translate.google.com/?sl=ja&tl=ko&op=translate&text=" + encodeURIComponent(jp);
const h = () => hide ? ` class="hid" title="눌러서 보기"` : "";

function render() {
  document.getElementById("tab-en").setAttribute("aria-selected", tab === "en");
  document.getElementById("tab-jp").setAttribute("aria-selected", tab === "jp");
  document.getElementById("date").textContent = label(n) + (n === today ? " · 오늘" : "");
  document.getElementById("nth").textContent = `${n + 1}일째`;
  document.getElementById("prev").disabled = n <= 0;
  document.getElementById("next").disabled = n >= today;
  document.getElementById("today").hidden = n === today;
  const card = document.getElementById("card"), more = document.getElementById("more");
  if (tab === "en") {
    const p = phrase(n);
    card.innerHTML = `<div class="en">${esc(p.en)}</div><div class="ko"${h()}>${esc(p.ko)}</div>
      <div class="ex">${esc(p.ex)}</div><a style="color:var(--en)" href="${youglish(p.en)}" target="_blank" rel="noopener">▶ 실제 영상 속 발음 듣기 (YouGlish)</a>`;
    let rows = "";
    for (let i = today; i >= 0; i--) {
      const q = phrase(i);
      rows += `<button data-n="${i}"${i === n ? ' aria-current="true"' : ""}><span class="d">${label(i).split(" ")[0]}</span>
        <span><span class="t">${esc(q.en)}</span><br><span class="m">${hide ? "" : esc(q.ko)}</span></span></button>`;
    }
    more.innerHTML = `<h2>지금까지 배운 표현 (${today + 1}개)</h2><div class="list">${rows}</div>`;
  } else {
    const ks = kanaAt(n), p = jpPhrase(n);
    card.innerHTML = `<div class="sub">${esc(ks[0][0])} · 오늘의 글자</div>
      <div class="kana">${ks.map(k => `<div><div class="k">${esc(k[1])}</div><div class="r"${h()}>${esc(k[2])}</div></div>`).join("")}</div>
      <hr><div class="sub">여행 표현</div><div class="jp">${esc(p.jp)}</div>
      <div class="ko"${h()}>${esc(p.ro)} · ${esc(p.ko)}</div>
      <a style="color:var(--jp)" href="${translate(p.jp)}" target="_blank" rel="noopener">▶ 발음 듣기 (Google 번역의 스피커 버튼)</a>`;
    const learned = new Map();  // kana index -> first day it was taught
    for (let i = 0; i <= today; i++) for (let j = 0; j < DATA.kanaPerDay; j++) {
      const idx = (i * DATA.kanaPerDay + j) % DATA.kana.length;
      if (!learned.has(idx)) learned.set(idx, i);
    }
    const nowSet = new Set(Array.from({length: DATA.kanaPerDay}, (_, j) => (n * DATA.kanaPerDay + j) % DATA.kana.length));
    const chart = script => {
      let cells = "";
      DATA.kana.forEach((k, idx) => {
        if (k[0] !== script) return;
        const on = learned.has(idx);
        cells += `<button ${on ? `data-n="${learned.get(idx)}"` : "disabled"} class="${on ? "on" : ""}${nowSet.has(idx) ? " now" : ""}">
          <span class="k">${esc(k[1])}</span><span class="r">${on && !hide ? esc(k[2]) : "&nbsp;"}</span></button>`;
      });
      return `<h2>${script}</h2><div class="chart">${cells}</div>`;
    };
    let rows = "";
    for (let i = today; i >= 0; i--) {
      const q = jpPhrase(i);
      rows += `<button data-n="${i}"${i === n ? ' aria-current="true"' : ""}><span class="d">${label(i).split(" ")[0]}</span>
        <span><span class="t" style="font-family:var(--f-jp)">${esc(q.jp)}</span><br><span class="m">${hide ? "" : esc(q.ko)}</span></span></button>`;
    }
    more.innerHTML = chart("히라가나") + chart("가타카나") + `<h2>지금까지 배운 여행 표현</h2><div class="list">${rows}</div>`;
  }
  history.replaceState(null, "", `#${tab}-${iso(start + n * DAY)}`);
}

function go(i) { n = Math.min(Math.max(i, 0), today); render(); }
document.getElementById("prev").onclick = () => go(n - 1);
document.getElementById("next").onclick = () => go(n + 1);
document.getElementById("today").onclick = () => go(today);
document.getElementById("tab-en").onclick = () => { tab = "en"; render(); };
document.getElementById("tab-jp").onclick = () => { tab = "jp"; render(); };
document.getElementById("hide").onchange = e => { hide = e.target.checked; render(); };
document.getElementById("card").onclick = e => { if (e.target.classList.contains("hid")) e.target.classList.remove("hid"); };
document.getElementById("more").onclick = e => { const b = e.target.closest("button[data-n]"); if (b) { go(+b.dataset.n); window.scrollTo({top: 0, behavior: "smooth"}); } };
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") go(n - 1); if (e.key === "ArrowRight") go(n + 1); });

// #en-2026-11-06 or #jp-2026-11-06 opens that tab and day
const m = location.hash.match(/^#(en|jp)(?:-(\d{4}-\d{2}-\d{2}))?$/);
if (m) { tab = m[1]; if (m[2]) n = Math.round((Date.parse(m[2] + "T00:00:00Z") - start) / DAY); }
go(n);
</script>
</body>
</html>
