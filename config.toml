# ===== 여기만 고치면 됩니다 =====
# 소스 추가/삭제는 `python manage.py add/remove`로도 가능하고, 이 파일을 직접 편집해도 됩니다.
# 변경 후에는 `python manage.py check`로 피드가 살아 있는지 확인하세요.

[settings]
max_minutes = 30                       # 하루 큐 최대 길이(분)
feed_days = 7                          # 개인 피드에 남길 일수
articles_per_day = 2                   # 하루에 읽을 외신 기사 수
recipient = ""                         # 아침 메일 수신 주소 (비우면 GMAIL_USER 환경변수 사용; 공개 저장소라 주소를 적지 않음)
base_url = "https://kyhwan53.github.io/language_learning"  # GitHub Pages 주소

# --- 소스 목록 ---
# key   : 아래 schedule에서 쓰는 짧은 이름 (영문/숫자)
# label : 메일/피드에 표시될 이름
# rss   : 팟캐스트 RSS 주소
# mode  : "newest" = 최신 에피소드부터, "oldest" = 가장 오래된 것부터 순서대로(입문 커리큘럼용)

[[source]]
key = "biz"
label = "EN Business"
rss = "https://podcasts.files.bbci.co.uk/p0h6ffwg.rss"   # BBC Learning English For Work
mode = "newest"

[[source]]
key = "easy"
label = "EN Easy"
rss = "https://podcasts.files.bbci.co.uk/p02pc9tn.rss"   # BBC 6 Minute English
mode = "newest"

[[source]]
key = "sci"
label = "EN Science"
rss = "https://feeds.npr.org/510351/podcast.xml"         # NPR Short Wave
mode = "newest"

[[source]]
key = "talk"
label = "EN Talk"
rss = "https://feeds.feedburner.com/tedtalks_audio"      # TED Talks Daily
mode = "newest"

[[source]]
key = "jp"
label = "JP Beginner"
rss = "https://nihongoconteppei.com/feed/podcast/"       # Nihongo con Teppei
mode = "oldest"

[[source]]
key = "lifekit"
label = "EN Life Kit"
rss = "https://feeds.npr.org/510338/podcast.xml"
mode = "newest"

[[source]]
key = "aee"
label = "EN All Ears"
rss = "https://allearsenglish.libsyn.com/rss"
mode = "newest"

# --- 읽기용 외신 기사 (RSS의 제목/요약/원문 링크만 사용, 전문은 복사하지 않음) ---
# 매일 articles_per_day개를 소스를 돌려가며 고릅니다. 추가는 아래 블록을 복사해 쓰면 됩니다.
# 순서가 중요: 2개씩 짝지어 돌아갑니다 (경제 → 국제정세, 경제 → 국제정세 ...). 짝수 개수를 유지하세요.
[[article]]
key = "bbc_business"
label = "BBC Business"
rss = "https://feeds.bbci.co.uk/news/business/rss.xml"

[[article]]
key = "bbc_world"
label = "BBC World"
rss = "https://feeds.bbci.co.uk/news/world/rss.xml"

[[article]]
key = "npr_economy"
label = "NPR Economy"
rss = "https://feeds.npr.org/1017/rss.xml"

[[article]]
key = "npr_world"
label = "NPR World"
rss = "https://feeds.npr.org/1004/rss.xml"

[[article]]
key = "guardian_business"
label = "Guardian Business"
rss = "https://www.theguardian.com/uk/business/rss"

[[article]]
key = "guardian_world"
label = "Guardian World"
rss = "https://www.theguardian.com/world/rss"

# --- 국내 리포트 (제목/저자 요약/원문 링크) ---
# naver : 네이버 증권 리서치 분류 (economy=경제분석, invest=투자정보, market=시황정보, debenture=채권분석,
#         industry=산업분석, company=종목분석) - 국내 증권사 리포트 모음, 최근 3일 중 조회수 1위
# rss   : RSS 주소 (한국은행 RSS 목록: https://www.bok.or.kr/static/view/popup/rss_popup.html) - 새 글이 있을 때만 표시
# count : 소스당 하루 최대 개수 (기본 1)
[[report]]
key = "nv_economy"
label = "증권사 경제분석"
naver = "economy"

[[report]]
key = "nv_invest"
label = "증권사 투자전략"
naver = "invest"

[[report]]
key = "bok_policy"
label = "한국은행 통화정책"
rss = "https://www.bok.or.kr/portal/bbs/P0000559/news.rss?menuNo=200690"

[[report]]
key = "bok_issue"
label = "한국은행 이슈노트"
rss = "https://www.bok.or.kr/portal/bbs/P0002353/news.rss?menuNo=200433"

# --- 요일별 편성 (위에서 정의한 key 사용, 순서대로 재생) ---
[schedule]
mon = ["biz", "aee", "jp"]
tue = ["easy", "talk", "jp"]
wed = ["biz", "talk", "jp"]
thu = ["easy", "aee", "jp"]
fri = ["biz", "talk", "jp"]
sat = ["easy", "lifekit", "jp"]
sun = ["biz", "lifekit", "jp"]
