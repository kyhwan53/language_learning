# ===== 여기만 고치면 됩니다 =====
# 소스 추가/삭제는 `python manage.py add/remove`로도 가능하고, 이 파일을 직접 편집해도 됩니다.
# 변경 후에는 `python manage.py check`로 피드가 살아 있는지 확인하세요.

[settings]
max_minutes = 30                       # 하루 큐 최대 길이(분)
feed_days = 7                          # 개인 피드에 남길 일수
recipient = ""                         # 아침 메일 수신 주소 (비우면 GMAIL_USER 환경변수 사용; 공개 저장소라 주소를 적지 않음)
base_url = "https://kyhwan53.github.io/language_learning"  # GitHub Pages 주소
cards_start = "2026-11-05"             # 업무 영어/일본어 카드 1일차 (content/*.toml을 이 날부터 하루 한 칸씩)

# --- 소스 목록 ---
# key   : 아래 schedule에서 쓰는 짧은 이름 (영문/숫자)
# label : 메일/피드에 표시될 이름
# rss   : 팟캐스트 RSS 주소
# mode  : "newest" = 최신 에피소드부터, "oldest" = 가장 오래된 것부터 순서대로(입문 커리큘럼용)

[[source]]
key = "biz"
label = "EN Business"
rss = "https://podcasts.files.bbci.co.uk/p0h6ffwg.rss"   # BBC Learning English For Work
mode = "newest"

[[source]]
key = "easy"
label = "EN Easy"
rss = "https://podcasts.files.bbci.co.uk/p02pc9tn.rss"   # BBC 6 Minute English
mode = "newest"

[[source]]
key = "sci"
label = "EN Science"
rss = "https://feeds.npr.org/510351/podcast.xml"         # NPR Short Wave
mode = "newest"

[[source]]
key = "talk"
label = "EN Talk"
rss = "https://feeds.feedburner.com/tedtalks_audio"      # TED Talks Daily
mode = "newest"

[[source]]
key = "lifekit"
label = "EN Life Kit"
rss = "https://feeds.npr.org/510338/podcast.xml"
mode = "newest"

[[source]]
key = "aee"
label = "EN All Ears"
rss = "https://allearsenglish.libsyn.com/rss"
mode = "newest"

# --- 읽기용 외신 기사 (RSS의 제목/요약/원문 링크만 사용, 전문은 복사하지 않음) ---
# section : 같은 section끼리 날마다 돌아가며 하루 1건씩 고릅니다 (section 수 = 하루 기사 수, 메일 순서는 아래 top 블록이 먼저).
#           top = 분야 구분 없는 주요 뉴스, business = 경제, environment = 환경·기후
#           새 분야를 넣으려면 새 section 이름으로 블록을 추가하면 됩니다.
[[article]]
key = "bbc_business"
section = "business"
label = "BBC Business"
rss = "https://feeds.bbci.co.uk/news/business/rss.xml"

[[article]]
key = "bbc_top"
section = "top"
label = "BBC Top Stories"
rss = "https://feeds.bbci.co.uk/news/rss.xml"

[[article]]
key = "npr_economy"
section = "business"
label = "NPR Economy"
rss = "https://feeds.npr.org/1017/rss.xml"

[[article]]
key = "npr_top"
section = "top"
label = "NPR News"
rss = "https://feeds.npr.org/1001/rss.xml"

[[article]]
key = "guardian_business"
section = "business"
label = "Guardian Business"
rss = "https://www.theguardian.com/uk/business/rss"

[[article]]
key = "guardian_top"
section = "top"
label = "Guardian Top Stories"
rss = "https://www.theguardian.com/international/rss"

[[article]]
key = "bbc_environment"
section = "environment"
label = "BBC Science & Environment"
rss = "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"

[[article]]
key = "guardian_environment"
section = "environment"
label = "Guardian Environment"
rss = "https://www.theguardian.com/uk/environment/rss"

[[article]]
key = "npr_climate"
section = "environment"
label = "NPR Climate"
rss = "https://feeds.npr.org/1167/rss.xml"

# --- 국내 리포트 (제목/저자 요약/원문 링크) ---
# slot  : "overnight"이면 KOREA REPORTS 대신 세계 경제 칸 맨 위(밤사이 미국)에 표시
# order : "newest"면 조회수보다 최신 우선 (매일 나오는 마감 시황용)
# naver : 네이버 증권 리서치 분류 (economy=경제분석, invest=투자정보, market=시황정보, debenture=채권분석,
#         industry=산업분석, company=종목분석) - 국내 증권사 리포트 모음, 최근 3일 중 조회수 1위
# rss   : RSS 주소 (한국은행 RSS 목록: https://www.bok.or.kr/static/view/popup/rss_popup.html) - 새 글이 있을 때만 표시
# count : 소스당 하루 최대 개수 (기본 1)
# prefer: 제목에 이 단어가 있는 리포트를 우선 (없으면 조회수 1위)
[[report]]
key = "nv_us_close"
label = "밤사이 미국 시장"
naver = "market"
slot = "overnight"
order = "newest"
prefer = ["미국 주식시장 마감", "미국 증시 마감", "뉴욕 증시", "미국"]

[[report]]
key = "nv_economy"
label = "증권사 경제분석"
naver = "economy"
prefer = ["미국", "미 ", "연준", "Fed", "FOMC", "뉴욕", "월가", "S&P", "나스닥", "다우", "빅테크", "달러", "US", "글로벌"]

[[report]]
key = "nv_invest"
label = "증권사 투자전략"
naver = "invest"
prefer = ["미국", "미 ", "연준", "Fed", "FOMC", "뉴욕", "월가", "S&P", "나스닥", "다우", "빅테크", "달러", "US", "글로벌"]

[[report]]
key = "bok_policy"
label = "한국은행 통화정책"
rss = "https://www.bok.or.kr/portal/bbs/P0000559/news.rss?menuNo=200690"

[[report]]
key = "bok_issue"
label = "한국은행 이슈노트"
rss = "https://www.bok.or.kr/portal/bbs/P0002353/news.rss?menuNo=200433"

# --- 중앙은행 회의 (정책 결정일, 해당 국가 현지 날짜) ---
# 다음 회의 날짜를 메일에 표시합니다. 해가 바뀌면 다음 해 일정을 추가하세요 (Claude에게 요청).
[central_banks]
fomc = ["2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09"]
bok = []   # 한국은행 금통위 통화정책방향 결정일 (한국은행 홈페이지 > 통화정책 > 금융통화위원회 일정)

# --- 요일별 편성 (위에서 정의한 key 사용, 순서대로 재생) ---
[schedule]
mon = ["biz", "aee"]
tue = ["easy", "talk"]
wed = ["biz", "talk"]
thu = ["easy", "aee"]
fri = ["biz", "talk"]
sat = ["easy", "lifekit"]
sun = ["biz", "lifekit"]
