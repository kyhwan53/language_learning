# 업무 영어 표현: 하루 1개, 순서대로 돌아갑니다 (끝나면 처음부터 다시).
# 회의 / 발표 / 협상 / 이메일 / R&D 보고에서 바로 쓸 수 있는 표현 위주. 직접 추가해도 됩니다.
# en = 표현, ko = 뜻, ex = 예문

[[phrase]]
en = "Let's get the ball rolling."
ko = "(회의를) 시작해 봅시다."
ex = "Since everyone's here, let's get the ball rolling with the pilot test results."

[[phrase]]
en = "to be on the same page"
ko = "같은 이해를 갖고 있다"
ex = "Before we finalize the scope, I want to make sure we're all on the same page."

[[phrase]]
en = "to circle back (to)"
ko = "(나중에) 다시 논의하다"
ex = "Let's circle back to the budget once we have the lab data."

[[phrase]]
en = "to touch base"
ko = "잠깐 연락해서 상황을 공유하다"
ex = "I'll touch base with the vendor this afternoon about the membrane delivery."

[[phrase]]
en = "Could you walk us through ...?"
ko = "~을 차근차근 설명해 주시겠어요?"
ex = "Could you walk us through how you calibrated the sensors?"

[[phrase]]
en = "The bottom line is ..."
ko = "핵심(결론)은 ~이다"
ex = "The bottom line is that the new process cuts energy use by 18 percent."

[[phrase]]
en = "to take something into account"
ko = "~을 고려하다"
ex = "We need to take seasonal variation into account when we size the reactor."

[[phrase]]
en = "That's a fair point, but ..."
ko = "일리 있는 말씀이지만 ~"
ex = "That's a fair point, but the regulation changes next year, so the timeline is tight."

[[phrase]]
en = "to flag (an issue)"
ko = "(문제를) 미리 짚어 두다"
ex = "I just want to flag that the sample size is still quite small."

[[phrase]]
en = "to follow up on"
ko = "~에 대해 후속 조치하다 / 다시 확인하다"
ex = "I'm following up on the action items from last week's meeting."

[[phrase]]
en = "Let me put it another way."
ko = "다른 식으로 말씀드려 볼게요."
ex = "Let me put it another way: every ton we capture costs less than paying the carbon fee."

[[phrase]]
en = "As you can see from this chart, ..."
ko = "이 그래프에서 보시다시피 ~"
ex = "As you can see from this chart, removal efficiency drops sharply below 10°C."

[[phrase]]
en = "to drill down into"
ko = "~을 자세히 파고들다"
ex = "Let's drill down into the cost breakdown for the second phase."

[[phrase]]
en = "a ballpark figure"
ko = "대략적인 수치"
ex = "Can you give me a ballpark figure for the installation cost?"

[[phrase]]
en = "to be up against (a deadline)"
ko = "(마감 등에) 쫓기다"
ex = "We're up against the end-of-quarter deadline for the grant report."

[[phrase]]
en = "to push back (on)"
ko = "반대 의견을 내다 / 일정을 미루다"
ex = "The client pushed back on the price, so we may need to revisit the scope."

[[phrase]]
en = "Where do we stand on ...?"
ko = "~은 지금 어떤 상황인가요?"
ex = "Where do we stand on the permit application?"

[[phrase]]
en = "to meet halfway"
ko = "서로 한 발씩 양보하다"
ex = "If you can extend the warranty, we could meet you halfway on the unit price."

[[phrase]]
en = "That's a deal-breaker for us."
ko = "그건 저희에게 협상 결렬 사유입니다."
ex = "A twelve-month delivery time would be a deal-breaker for us."

[[phrase]]
en = "Is there any flexibility on ...?"
ko = "~에 조정의 여지가 있을까요?"
ex = "Is there any flexibility on the payment terms?"

[[phrase]]
en = "to have some leeway"
ko = "(일정·예산에) 여유가 있다"
ex = "We have some leeway on the schedule, but not on the budget."

[[phrase]]
en = "Going forward, ..."
ko = "앞으로는 ~"
ex = "Going forward, we'll share the monitoring data every Monday."

[[phrase]]
en = "to roll out"
ko = "(단계적으로) 도입·출시하다"
ex = "We plan to roll out the new monitoring system at two plants first."

[[phrase]]
en = "to scale up"
ko = "규모를 키우다 (실험실 → 파일럿 → 상용)"
ex = "The main challenge is scaling up from bench scale to a pilot plant."

[[phrase]]
en = "proof of concept"
ko = "개념 검증 (PoC)"
ex = "The proof of concept worked, so now we need funding for the pilot."

[[phrase]]
en = "a trade-off between A and B"
ko = "A와 B 사이의 상충 관계"
ex = "There's a trade-off between treatment efficiency and operating cost."

[[phrase]]
en = "to be in line with"
ko = "~와 일치하다 / 부합하다"
ex = "The results are in line with what we saw in the lab."

[[phrase]]
en = "to fall short of"
ko = "~에 미치지 못하다"
ex = "Output fell short of our target because of the pump failure."

[[phrase]]
en = "to outperform"
ko = "~보다 성능이 뛰어나다"
ex = "The new catalyst outperformed the reference material in every test."

[[phrase]]
en = "a key takeaway"
ko = "핵심 시사점"
ex = "The key takeaway from the field test is that maintenance drives most of the cost."

[[phrase]]
en = "to shed light on"
ko = "~을 밝혀 주다"
ex = "These measurements shed light on why the odor complaints peak in summer."

[[phrase]]
en = "to raise a concern"
ko = "우려를 제기하다"
ex = "The safety team raised a concern about the storage of the reagents."

[[phrase]]
en = "to address (an issue)"
ko = "(문제를) 다루다 / 해결하다"
ex = "The revised design addresses the clogging issue we saw in phase one."

[[phrase]]
en = "I'd like to build on what ... said."
ko = "~님 말씀에 덧붙이자면"
ex = "I'd like to build on what Dr. Kim said about sludge reuse."

[[phrase]]
en = "Sorry to interrupt, but ..."
ko = "말씀 중에 죄송하지만 ~"
ex = "Sorry to interrupt, but could you clarify which data set that was?"

[[phrase]]
en = "Just to clarify, ..."
ko = "확인차 여쭙자면 ~"
ex = "Just to clarify, are those numbers before or after pretreatment?"

[[phrase]]
en = "to keep someone in the loop"
ko = "(진행 상황을) 계속 공유하다"
ex = "Please keep me in the loop on any changes to the test schedule."

[[phrase]]
en = "to get buy-in (from)"
ko = "(이해관계자의) 동의·지지를 얻다"
ex = "We need buy-in from the operations team before we change the process."

[[phrase]]
en = "low-hanging fruit"
ko = "쉽게 얻을 수 있는 성과"
ex = "Fixing the aeration schedule is low-hanging fruit for energy savings."

[[phrase]]
en = "to move the needle"
ko = "눈에 띄는 변화를 만들다"
ex = "Small tweaks won't move the needle; we need a different process."

[[phrase]]
en = "in the long run"
ko = "장기적으로는"
ex = "In the long run, the higher upfront cost pays for itself."

[[phrase]]
en = "to cut corners"
ko = "(비용·시간을 아끼려) 대충 하다"
ex = "We can't cut corners on the QA/QC procedures for this data."

[[phrase]]
en = "to run the numbers"
ko = "계산해 보다"
ex = "Let me run the numbers and get back to you by Friday."

[[phrase]]
en = "to get back to someone"
ko = "(확인 후) 다시 연락드리다"
ex = "I don't have the figure on hand, but I'll get back to you today."

[[phrase]]
en = "Please find attached ..."
ko = "~을 첨부합니다 (이메일)"
ex = "Please find attached the draft report for your review."

[[phrase]]
en = "at your earliest convenience"
ko = "편하실 때 가능한 한 빨리 (이메일)"
ex = "Please send the signed agreement at your earliest convenience."

[[phrase]]
en = "I'm reaching out regarding ..."
ko = "~ 건으로 연락드립니다 (이메일 첫 문장)"
ex = "I'm reaching out regarding the joint research proposal we discussed."

[[phrase]]
en = "to loop in"
ko = "(대화·메일에) 포함시키다"
ex = "I'm looping in Sarah, who manages the field sampling."

[[phrase]]
en = "to put something on hold"
ko = "~을 보류하다"
ex = "We've put the second site on hold until the permit comes through."

[[phrase]]
en = "to be on track"
ko = "계획대로 진행 중이다"
ex = "Phase two is on track to finish by the end of March."

[[phrase]]
en = "to fall behind schedule"
ko = "일정이 지연되다"
ex = "We fell behind schedule because the equipment arrived late."

[[phrase]]
en = "to bring someone up to speed"
ko = "~에게 최신 상황을 알려 주다"
ex = "Could you bring the new team members up to speed on the project?"

[[phrase]]
en = "to weigh the pros and cons"
ko = "장단점을 따져 보다"
ex = "Let's weigh the pros and cons of on-site versus off-site treatment."

[[phrase]]
en = "That's beyond the scope of ..."
ko = "그건 ~의 범위를 벗어납니다"
ex = "Long-term monitoring is beyond the scope of this contract."

[[phrase]]
en = "to hit a snag"
ko = "(뜻밖의) 문제에 부딪히다"
ex = "We hit a snag with the data logger, but it's fixed now."

[[phrase]]
en = "to iron out (the details)"
ko = "(세부 사항을) 조율해 정리하다"
ex = "We still need to iron out the details of the data-sharing agreement."

[[phrase]]
en = "a win-win"
ko = "모두에게 이득인 것"
ex = "Sharing the pilot site would be a win-win for both institutes."

[[phrase]]
en = "to sign off on"
ko = "~을 최종 승인하다"
ex = "Management signed off on the budget for the field trial."

[[phrase]]
en = "To wrap up, ..."
ko = "정리하자면 ~ (발표 마무리)"
ex = "To wrap up, the technology is ready for a larger-scale demonstration."

[[phrase]]
en = "I'm happy to take any questions."
ko = "질문 받겠습니다."
ex = "That's all from me. I'm happy to take any questions."
